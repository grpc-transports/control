version: '3'

tasks:
  test:
    desc: "Run tests"
    cmds:
      - go test -mod=mod -timeout 120s -cover ./...

  build:
    desc: "Build (library — compile check only)"
    cmds:
      - go build -mod=mod ./...

  lint:
    desc: "Vet the package"
    cmds:
      - go vet -mod=mod ./...

  race:
    desc: "Run tests under the race detector"
    cmds:
      - go test -mod=mod -timeout 300s -race ./...
